<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/pp-neuemontreal-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/pp-mondwest-regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- head -->
    <!-- The page's words, for readers that don't run it (see src/meta); the garden replaces them. -->
    <style>[data-words] { display: none }</style>
    <noscript>
      <style>
        [data-words] { display: block; max-width: 36rem; margin: 4rem auto; padding: 0 1.5rem; font: 16px/1.55 'PP Neue Montreal', system-ui, sans-serif; color: #757575 }
        [data-words] :is(h1, h2) { margin: 2rem 0 1rem; font-weight: 400; font-size: 1.25rem; color: #111214 }
        [data-words] h1 { font-size: 2rem }
        [data-words] :is(p, ul) { margin: 0 0 1rem }
        [data-words] b { font-weight: 400; color: #111214 }
        [data-words] a { color: #007bb9 }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><main data-words><!-- words --></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
